server:
  port: ${PORT:8080}

spring:
  application:
    name: traceguard-engine
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/traceguard
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

traceguard:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-2.5-flash

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:traceguard;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
